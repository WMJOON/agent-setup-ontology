# agent-setup-ontology — Repo Instances
# All repo entries extracted from ontology.yaml.
version: "0.1.0"

repos:

  # ── Automation ─────────────────────────────────────────

  - id: repo-openclaw
    label: "OpenClaw"
    github: "openclaw/openclaw"
    framework_ref: openclaw
    category: automation
    stars_approx: "40K+"
    min_model_quality: standard
    min_memory_gb: 16
    ollama_compatible: true
    install: |
      git clone https://github.com/openclaw/openclaw
      cd openclaw && npm install
      cp .env.example .env   # set OLLAMA_HOST=http://localhost:11434
      npm start
    setup_guide: "https://github.com/Ryuki0x1/openclaw-local-llm-setup"
    awesome_list: "https://github.com/mergisi/awesome-openclaw-agents"
    note: >
      Personal AI agent: browser, file, shell, calendar, messaging.
      Connects via WhatsApp / Telegram / Slack / Signal.
      Reliable threshold: 32B+ models (24GB VRAM or Apple Silicon 32GB+).

  # ── UI ─────────────────────────────────────────────────

  - id: repo-open-webui
    label: "Open WebUI"
    github: "open-webui/open-webui"
    framework_ref: open-webui
    category: ui
    stars_approx: "80K+"
    min_model_quality: light
    min_memory_gb: 8
    ollama_compatible: true
    install: |
      docker run -d -p 3000:8080 \
        -e OLLAMA_BASE_URL=http://host.docker.internal:11434 \
        -v open-webui:/app/backend/data \
        ghcr.io/open-webui/open-webui:main
    note: "ChatGPT-like UI for Ollama. No coding required."

  # ── Agent Frameworks ────────────────────────────────────

  - id: repo-smolagents
    label: "smolagents (HuggingFace)"
    github: "huggingface/smolagents"
    framework_ref: smolagents
    category: agent
    stars_approx: "20K+"
    min_model_quality: standard
    min_memory_gb: 16
    ollama_compatible: true
    install: |
      pip install smolagents[ollama]
    quickstart: |
      from smolagents import CodeAgent, OllamaModel, DuckDuckGoSearchTool
      agent = CodeAgent(tools=[DuckDuckGoSearchTool()],
                        model=OllamaModel("qwen3.5:9b"))
      agent.run("Search and summarize today's AI news")

  - id: repo-qwen-agent
    label: "Qwen-Agent"
    github: "QwenLM/Qwen-Agent"
    framework_ref: qwen-agent
    category: agent
    stars_approx: "7K+"
    min_model_quality: standard
    min_memory_gb: 16
    ollama_compatible: true
    install: |
      pip install qwen-agent
    note: "Qwen official agent framework. MCP + Function Calling + RAG."

  - id: repo-crewai
    label: "CrewAI"
    github: "crewAIInc/crewAI"
    framework_ref: crewai
    category: agent
    stars_approx: "30K+"
    min_model_quality: standard-plus
    min_memory_gb: 32
    ollama_compatible: true
    install: |
      pip install crewai

  - id: repo-langgraph
    label: "LangGraph"
    github: "langchain-ai/langgraph"
    framework_ref: langgraph
    category: agent
    stars_approx: "15K+"
    min_model_quality: standard
    min_memory_gb: 16
    ollama_compatible: true
    install: |
      pip install langgraph langchain-community

  # ── IDE ────────────────────────────────────────────────

  - id: repo-continue
    label: "Continue"
    github: "continuedev/continue"
    framework_ref: continue
    category: ide
    stars_approx: "25K+"
    min_model_quality: light
    min_memory_gb: 8
    ollama_compatible: true
    install: "VSCode Marketplace → search 'Continue' → Install"
    note: "Open-source Copilot alternative. Configure Ollama in settings.json."

  # ── RAG ────────────────────────────────────────────────

  - id: repo-llamaindex
    label: "LlamaIndex"
    github: "run-llama/llama_index"
    framework_ref: llamaindex
    category: rag
    stars_approx: "40K+"
    min_model_quality: standard
    min_memory_gb: 16
    ollama_compatible: true
    install: |
      pip install llama-index llama-index-llms-ollama

  # ── Additional Framework Repos ─────────────────────────

  - id: repo-autogen
    label: "AutoGen (Microsoft)"
    github: "microsoft/autogen"
    framework_ref: autogen
    category: agent
    stars_approx: "40K+"
    min_model_quality: standard-plus
    min_memory_gb: 32
    ollama_compatible: true
    install: |
      pip install pyautogen
    quickstart: |
      from autogen import AssistantAgent, UserProxyAgent
      assistant = AssistantAgent("assistant",
          llm_config={"config_list": [{"model": "qwen3.5:35b-a3b",
                                       "base_url": "http://localhost:11434/v1",
                                       "api_key": "ollama"}]})
      user = UserProxyAgent("user", human_input_mode="NEVER")
      user.initiate_chat(assistant, message="Write a Python hello world")
    note: >
      Supports Ollama via OpenAI-compatible endpoint.
      Set base_url to http://localhost:11434/v1, api_key to "ollama".
      Recommended model: qwen3.5:35b-a3b or qwen3.5:27b for multi-agent tasks.

  - id: repo-agno
    label: "Agno"
    github: "agno-agi/agno"
    framework_ref: agno
    category: agent
    stars_approx: "25K+"
    min_model_quality: standard
    min_memory_gb: 16
    ollama_compatible: true
    install: |
      pip install agno
    quickstart: |
      from agno.agent import Agent
      from agno.models.ollama import Ollama
      from agno.tools.duckduckgo import DuckDuckGoTools
      agent = Agent(model=Ollama(id="qwen3.5:9b"),
                    tools=[DuckDuckGoTools()], markdown=True)
      agent.print_response("Search for the latest AI news", stream=True)
    note: "Built-in tool library (web, finance, news). Fastest to a working agent."

  - id: repo-openhands
    label: "OpenHands (OpenDevin)"
    github: "All-Hands-AI/OpenHands"
    framework_ref: openhands
    category: automation
    stars_approx: "50K+"
    min_model_quality: pro
    min_memory_gb: 32
    ollama_compatible: true
    install: |
      docker run -it --pull=always \
        -e SANDBOX_RUNTIME_CONTAINER_IMAGE=docker.all-hands.dev/all-hands-ai/runtime:0.38-nikolaik \
        -e LOG_ALL_EVENTS=true \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v ~/.openhands-state:/.openhands-state \
        -p 3000:3000 \
        docker.all-hands.dev/all-hands-ai/openhands:0.38
    note: >
      Set OLLAMA_BASE_URL=http://host.docker.internal:11434 in Docker env
      to connect to local Ollama. Select model in the UI settings.
      Reliable threshold: pro-tier model (qwen3.5:35b-a3b or larger).

  - id: repo-haystack
    label: "Haystack (deepset)"
    github: "deepset-ai/haystack"
    framework_ref: haystack
    category: rag
    stars_approx: "20K+"
    min_model_quality: standard
    min_memory_gb: 16
    ollama_compatible: true
    install: |
      pip install haystack-ai ollama-haystack
    note: "Component-based RAG pipelines. Alternative to LlamaIndex for complex retrieval workflows."

  - id: repo-dify
    label: "Dify"
    github: "langgenius/dify"
    framework_ref: dify
    category: ui
    stars_approx: "90K+"
    min_model_quality: light
    min_memory_gb: 8
    ollama_compatible: true
    install: |
      git clone https://github.com/langgenius/dify
      cd dify/docker && cp .env.example .env
      docker compose up -d
      # Then open http://localhost/install → Settings → Model Provider → Ollama
    note: >
      Most starred self-hosted LLM platform.
      Visual workflow builder, RAG pipeline, and agent creation without code.
      Connect Ollama: Model Provider → Ollama → http://host.docker.internal:11434.

  - id: repo-n8n
    label: "n8n"
    github: "n8n-io/n8n"
    framework_ref: n8n
    category: automation
    stars_approx: "70K+"
    min_model_quality: light
    min_memory_gb: 8
    ollama_compatible: true
    install: |
      docker run -it --rm \
        -p 5678:5678 \
        -v ~/.n8n:/home/node/.n8n \
        docker.n8n.io/n8nio/n8n
    note: >
      Trigger-based workflow automation platform.
      Best for scheduled jobs, app integrations, and light AI orchestration with Ollama.

  - id: repo-faster-whisper
    label: "faster-whisper"
    github: "SYSTRAN/faster-whisper"
    framework_ref: faster-whisper-stack
    category: automation
    stars_approx: "10K+"
    min_model_quality: light
    min_memory_gb: 8
    ollama_compatible: false
    install: |
      pip install faster-whisper
    note: >
      Fast local Whisper inference for transcription workloads.
      Usually paired with a second summarization/assistant layer rather than used alone.

  # ── Knowledge Graph Construction ────────────────────────

  - id: repo-neo4j-llm-graph-builder
    label: "Neo4j LLM Graph Builder"
    github: "neo4j-labs/llm-graph-builder"
    framework_ref: neo4j-llm-graph-builder
    category: rag
    stars_approx: "~2,800"
    min_model_quality: standard
    min_memory_gb: 16
    ollama_compatible: true
    install: |
      docker compose up --build
      # Requires OpenAI / Claude API key or local LLM endpoint
    note: >
      LLM-powered knowledge graph construction from unstructured documents.
      Extracts entities and relations into Neo4j. Supports OpenAI, Claude, Llama.
      Best entry point for graph RAG pipelines; actively maintained (2025).

  - id: repo-deepke
    label: "DeepKE"
    github: "zjunlp/DeepKE"
    framework_ref: deepke
    category: rag
    stars_approx: "~3,500"
    min_model_quality: standard
    min_memory_gb: 16
    ollama_compatible: false
    install: |
      pip install deepke
    note: >
      ML + LLM hybrid knowledge extraction framework (NER, RE, EE).
      Multilingual (including Chinese). Research-grade — requires ML background.
      Last updated 2024; suitable for academic KG construction pipelines.

  - id: repo-rebel
    label: "REBEL (Relation Extraction by End-to-end Language generation)"
    github: "Babelscape/rebel"
    framework_ref: rebel
    category: rag
    stars_approx: "~1,200"
    min_model_quality: light
    min_memory_gb: 8
    ollama_compatible: false
    install: |
      pip install transformers
      # Load Babelscape/rebel-large from HuggingFace Hub
    note: >
      seq2seq relation extraction via fine-tuned BART. No LLM needed — runs on CPU.
      Extracts (subject, relation, object) triples from raw text.
      Best as a preprocessing layer for KG construction pipelines. Last updated 2023.

  - id: repo-knowledge-graph-llm
    label: "knowledge_graph (LLM → GraphRAG)"
    github: "rahulnyk/knowledge_graph"
    framework_ref: knowledge-graph-llm
    category: rag
    stars_approx: "~1,000"
    min_model_quality: standard
    min_memory_gb: 8
    ollama_compatible: true
    install: |
      pip install langchain openai networkx pyvis
    note: >
      Lightweight LLM-driven KG builder. Converts text to NetworkX graph via GPT prompts.
      Low setup barrier — good reference implementation for custom GraphRAG experiments.
      Last updated 2024.

  - id: repo-text2triple-agent
    label: "Text2Triple LLM Agent"
    github: "semantic-systems/text2triple"
    framework_ref: text2triple-agent
    category: rag
    stars_approx: "~150"
    min_model_quality: standard
    min_memory_gb: 8
    ollama_compatible: false
    install: |
      # See repo README — requires REBEL model + LLM API key
    note: >
      ESWC 2024 paper implementation. LLM agent orchestrating REBEL for triple extraction.
      Research prototype — low star count, not production-ready. Last updated 2024.

  - id: repo-ndex-llm-kg
    label: "NDEx LLM Text-to-Knowledge-Graph"
    github: "ndexbio/llm-kg"
    framework_ref: ndex-llm-kg
    category: rag
    stars_approx: "~200"
    min_model_quality: standard
    min_memory_gb: 8
    ollama_compatible: false
    install: |
      pip install ndex2 openai
    note: >
      PDF-to-KG pipeline specialized for scientific papers (life sciences).
      Integrates with NDEx network database. Actively maintained (2025).
      Best for academic / life science paper RAG workflows.

  - id: repo-skg-pipeline
    label: "SKG Pipeline (CS Paper KG)"
    github: "jackyin68/SKG"
    framework_ref: skg-pipeline
    category: rag
    stars_approx: "~80"
    min_model_quality: light
    min_memory_gb: 8
    ollama_compatible: false
    install: |
      # See repo README — rule-based + deep learning pipeline
    note: >
      Rule + deep learning pipeline for scientific KG construction from CS papers.
      Not LLM-based. Last updated 2022 — consider as reference architecture only.

  # ── Code Graph / IDE Skills ───────────────────────────

  - id: repo-graphify
    label: "Graphify"
    github: "safishamsi/graphify"
    framework_ref: graphify
    category: ide
    stars_approx: "~43,700"
    min_model_quality: light
    min_memory_gb: 8
    ollama_compatible: true
    install: |
      uv tool install graphifyy && graphify install
      # then in any AI coding assistant: /graphify .
      # Optional extras: pip install graphifyy[office] / graphifyy[video]
    note: >
      Single-command project-to-KG skill. Handles code (28 langs, local tree-sitter — no API cost),
      docs/PDFs/images (assistant API), video/YouTube/ArXiv (optional extras).
      Works with Claude Code, Cursor, Codex, Gemini CLI, OpenClaw, etc.
      Ollama-compatible: any local model serving as the coding assistant can read the generated graph.
      43K+ stars within first month of release (April 2026). Actively maintained.

