    stars_approx: "N/A (HuggingFace model weights)"
    min_model_quality: light
    min_memory_gb: 8
    ollama_compatible: false
    install: |
      pip install transformers torch
      # from transformers import pipeline
      # pipe = pipeline("zero-shot-image-classification", model="google/siglip2-base-patch16-224")
    note: >
      Google DeepMind zero-shot 이미지 분류. ViT-B/16 기준 Top-1 78.2%.
