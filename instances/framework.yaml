# agent-setup-ontology — Framework Instances
# All framework entries extracted from ontology.yaml.
version: "0.1.0"

frameworks:

  # ── Agent Frameworks ───────────────────────────────────

  - id: smolagents
    label: "smolagents (HuggingFace)"
    kind: agent
    complexity: low
    local_capable: true
    runtime_support: [ollama, huggingface, litellm, openai, anthropic]
    multiagent: true
    mcp_support: false
    install: "pip install smolagents[ollama]"
    best_for: [web_automation, file_automation, web_research, schedule_task]
    note: "Lowest barrier to entry. Agent running in 5 lines. Code-execution approach."

  - id: qwen-agent
    label: "Qwen-Agent"
    kind: agent
    complexity: low
    local_capable: true
    runtime_support: [ollama, openai, any]
    multiagent: true
    mcp_support: true
    install: "pip install qwen-agent"
    best_for: [web_automation, code_generation, document_rag, agent_monitoring]
    note: "Optimized for Qwen models. Native MCP protocol support."

  - id: crewai
    label: "CrewAI"
    kind: agent
    complexity: medium
    local_capable: true
    runtime_support: [ollama, openai, anthropic, any]
    multiagent: true
    mcp_support: false
    install: "pip install crewai"
    best_for: [multi_agent, deep_research, code_review]
    note: "Role-based multi-agent orchestration. Best for collaborative pipelines."

  - id: langgraph
    label: "LangGraph"
    kind: agent
    complexity: high
    local_capable: true
    runtime_support: [ollama, openai, anthropic, huggingface, any]
    multiagent: true
    mcp_support: false
    install: "pip install langgraph langchain-community"
    best_for: [multi_agent, agent_monitoring]
    note: "Graph-based stateful workflows. Most flexible, steepest learning curve."

  # ── Automation Frameworks ──────────────────────────────

  - id: openclaw
    label: "OpenClaw"
    kind: automation
    complexity: medium
    local_capable: true
    runtime_support: [ollama, openai, anthropic]
    multiagent: false
    mcp_support: false
    install: "https://github.com/openclaw/openclaw"
    best_for: [web_automation]
    note: "Autonomous browser, file, and code execution. LLM wrapper for desktop automation."

  - id: hermes-agent
    label: "Hermes Agent (Nous Research)"
    kind: automation
    complexity: medium
    local_capable: true
    runtime_support: [openai, anthropic, openrouter, any]
    multiagent: true
    mcp_support: true
    install: "https://github.com/NousResearch/hermes-agent"
    best_for: [personal_assistant, web_automation, file_automation, schedule_task, home_dashboard_agent, email_assistant, browser_operator]
    note: >
      Self-improving terminal agent. Persistent memory + skills learned from past sessions.
      40+ tools, MCP integration, cron scheduling, messaging across Telegram/Discord/Slack/WhatsApp/Signal.
      Seven execution backends (local, Docker, SSH, Singularity, Modal, Daytona, Vercel) — runs on $5 VPS to GPU clusters.
      Provider-agnostic: Nous Portal, OpenRouter, NIM, OpenAI, Anthropic, HuggingFace, or custom OpenAI-compatible endpoint (Ollama via custom endpoint).
      Spawns isolated subagents for parallel workstreams.

  # ── UI Front-ends ──────────────────────────────────────

  - id: open-webui
    label: "Open WebUI"
    kind: ui
    complexity: low
    local_capable: true
    runtime_support: [ollama, openai]
    multiagent: false
    mcp_support: false
    install: "docker run -d -p 3000:8080 ghcr.io/open-webui/open-webui"
    best_for: [general_qa, writing_assistant]
    note: "ChatGPT-like web UI for Ollama. No coding required."

  - id: anythingllm
    label: "AnythingLLM"
    kind: ui
    complexity: low
    local_capable: true
    runtime_support: [ollama, openai, anthropic, any]
    multiagent: false
    mcp_support: false
    install: "https://anythingllm.com/download"
    best_for: [general_qa, document_rag]
    note: "Desktop app with built-in RAG. Good for non-technical users."

  # ── IDE Extensions ─────────────────────────────────────

  - id: continue
    label: "Continue (VSCode / JetBrains)"
    kind: ide
    complexity: low
    local_capable: true
    runtime_support: [ollama, openai, anthropic, any]
    multiagent: false
    mcp_support: false
    install: "VSCode Marketplace: Continue"
    best_for: [local_copilot, code_generation]
    note: "Inline code copilot. Drop-in replacement for GitHub Copilot."

  # ── RAG Frameworks ─────────────────────────────────────

  - id: llamaindex
    label: "LlamaIndex"
    kind: rag
    complexity: medium
    local_capable: true
    runtime_support: [ollama, openai, anthropic, huggingface, any]
    multiagent: false
    mcp_support: false
    install: "pip install llama-index llama-index-llms-ollama"
    best_for: [document_rag, deep_research]
    note: "Production-grade RAG. Best for large document collections."

  # ── Additional Agent Frameworks ────────────────────────

  - id: autogen
    label: "AutoGen (Microsoft)"
    kind: agent
    complexity: medium
    local_capable: true
    runtime_support: [ollama, openai, anthropic, litellm, any]
    multiagent: true
    mcp_support: false
    install: "pip install pyautogen"
    best_for: [multi_agent, code_generation, code_review, agent_monitoring]
    note: >
      Microsoft's flagship multi-agent framework.
      AssistantAgent + UserProxyAgent conversation pattern.
      Supports Ollama via LiteLLM proxy (set api_base to localhost:11434/v1).
      Best for: agent evaluation loops, code generation with human-in-the-loop.

  - id: agno
    label: "Agno (formerly Phidata)"
    kind: agent
    complexity: low
    local_capable: true
    runtime_support: [ollama, openai, anthropic, any]
    multiagent: true
    mcp_support: false
    install: "pip install agno"
    best_for: [web_research, web_automation, multi_agent, document_rag, deep_research]
    note: >
      Lightweight multi-modal agent framework with built-in tools
      (DuckDuckGo, YFinance, newspaper, etc.).
      Agent in <10 lines with tool use. Low barrier to entry, similar to smolagents.

  - id: openhands
    label: "OpenHands (OpenDevin)"
    kind: automation
    complexity: medium
    local_capable: true
    runtime_support: [ollama, openai, anthropic, any]
    multiagent: false
    mcp_support: false
    install: |
      docker run -it --pull=always \
        -e SANDBOX_RUNTIME_CONTAINER_IMAGE=docker.all-hands.dev/all-hands-ai/runtime:0.38-nikolaik \
        -e LOG_ALL_EVENTS=true \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v ~/.openhands-state:/.openhands-state \
        -p 3000:3000 \
        docker.all-hands.dev/all-hands-ai/openhands:0.38
    best_for: [code_generation, code_review, file_automation, web_automation]
    note: >
      Autonomous software development agent. Runs code, browses the web,
      and edits files in a sandboxed Docker environment.
      Requires pro-tier model (32B+) for reliable multi-step code execution.
      Local use: point to Ollama via OLLAMA_BASE_URL in Docker env.

  # ── Additional RAG Framework ───────────────────────────

  - id: haystack
    label: "Haystack (deepset)"
    kind: rag
    complexity: medium
    local_capable: true
    runtime_support: [ollama, openai, anthropic, huggingface, any]
    multiagent: false
    mcp_support: false
    install: "pip install haystack-ai ollama-haystack"
    best_for: [document_rag, web_research, deep_research]
    note: >
      Production-grade pipeline framework for RAG and NLP workloads.
      Component-based (Retriever, Reader, Ranker) makes complex pipelines composable.
      Alternative to LlamaIndex when pipeline configurability is important.

  # ── Additional UI / Platform ───────────────────────────

  - id: dify
    label: "Dify"
    kind: ui
    complexity: low
    local_capable: true
    runtime_support: [ollama, openai, anthropic, any]
    multiagent: false
    mcp_support: false
    install: |
      git clone https://github.com/langgenius/dify
      cd dify/docker && cp .env.example .env
      docker compose up -d
    best_for: [general_qa, document_rag, writing_assistant, web_research]
    note: >
      Visual LLM app builder (90K+ GitHub stars, most starred LLM platform).
      Self-hosted via Docker. No-code chatbot, agent, and RAG workflow creation.
      Connect to Ollama by setting provider to "Ollama" in model settings.
      Best for non-technical users who want Dify's UI over raw API.

  - id: claude-code
    label: "Claude Code"
    kind: ide
    complexity: low
    local_capable: false
    runtime_support: [anthropic]
    multiagent: false
    mcp_support: true
    install: "https://docs.anthropic.com/en/docs/claude-code"
    best_for: [code_generation, code_review, local_copilot, deep_research]
    note: >
      Best-in-class coding copilot and repo reasoning interface when Anthropic API is acceptable.
      Not local-only, but often the reference UX users compare against.

  - id: n8n
    label: "n8n"
    kind: automation
    complexity: medium
    local_capable: true
    runtime_support: [ollama, openai, anthropic, any]
    multiagent: false
    mcp_support: false
    install: "docker run -it --rm -p 5678:5678 -v ~/.n8n:/home/node/.n8n docker.n8n.io/n8nio/n8n"
    best_for: [schedule_task, file_automation, personal_assistant, web_research]
    note: >
      Workflow automation platform rather than a pure agent framework.
      Excellent for scheduled tasks, integrations, and trigger-based orchestration.

  - id: faster-whisper-stack
    label: "faster-whisper stack"
    kind: automation
    complexity: medium
    local_capable: true
    runtime_support: [ollama, any]
    multiagent: false
    mcp_support: false
    install: "pip install faster-whisper"
    best_for: [voice_transcription_workbench, meeting_summarizer]
    note: >
      Not a full agent framework by itself, but a practical local transcription layer often paired with assistant workflows.

  # ── Knowledge Graph Construction ────────────────────────

  - id: neo4j-llm-graph-builder
    label: "Neo4j LLM Graph Builder"
    kind: rag
    complexity: medium
    local_capable: true
    runtime_support: [openai, anthropic, any]
    multiagent: false
    mcp_support: false
    install: "docker compose up --build"
    best_for: [document_rag, deep_research, research_pipeline]
    stars_approx: "~2,800"
    last_updated: "2025"
    note: >
      LLM-powered knowledge graph construction from unstructured text.
      Supports OpenAI, Claude, Llama. Neo4j-native — best for graph RAG pipelines.

  - id: deepke
    label: "DeepKE"
    kind: rag
    complexity: high
    local_capable: true
    runtime_support: [huggingface, openai, any]
    multiagent: false
    mcp_support: false
    install: "pip install deepke"
    best_for: [deep_research, research_pipeline, document_rag]
    stars_approx: "~3,500"
    last_updated: "2024"
    note: >
      ML + LLM hybrid knowledge extraction framework (NER, RE, EE).
      Multilingual support including Chinese. Research-grade — requires ML background.

  - id: rebel
    label: "REBEL (Relation Extraction)"
    kind: rag
    complexity: high
    local_capable: true
    runtime_support: [huggingface]
    multiagent: false
    mcp_support: false
    install: "pip install transformers && # load Babelscape/rebel-large from HuggingFace"
    best_for: [document_rag, deep_research]
    stars_approx: "~1,200"
    last_updated: "2023"
    note: >
      seq2seq relation extraction via fine-tuned BART. Extracts (subject, relation, object) triples.
      No LLM needed — runs on CPU. Best as a preprocessing layer for KG construction pipelines.

  - id: knowledge-graph-llm
    label: "knowledge_graph (LLM → GraphRAG)"
    kind: rag
    complexity: low
    local_capable: true
    runtime_support: [openai, any]
    multiagent: false
    mcp_support: false
    install: "pip install langchain openai networkx pyvis"
    best_for: [document_rag, deep_research, local_rag_server]
    stars_approx: "~1,000"
    last_updated: "2024"
    note: >
      Lightweight LLM-driven KG builder. Converts text to NetworkX graph via GPT prompts.
      Low setup barrier — good reference implementation for custom GraphRAG experiments.

  - id: text2triple-agent
    label: "Text2Triple LLM Agent"
    kind: agent
    complexity: high
    local_capable: false
    runtime_support: [openai, any]
    multiagent: false
    mcp_support: false
    install: "# See repo README — requires REBEL model + LLM API"
    best_for: [deep_research, research_pipeline]
    stars_approx: "~150"
    last_updated: "2024"
    note: >
      ESWC 2024 paper implementation. LLM agent orchestrating REBEL for triple extraction.
      Low star count — research prototype, not production-ready.

  - id: ndex-llm-kg
    label: "NDEx LLM Text-to-Knowledge-Graph"
    kind: rag
    complexity: medium
    local_capable: false
    runtime_support: [openai, anthropic]
    multiagent: false
    mcp_support: false
    install: "pip install ndex2 openai"
    best_for: [deep_research, research_pipeline, document_rag]
    stars_approx: "~200"
    last_updated: "2025"
    note: >
      PDF-to-KG pipeline specialized for scientific papers. Integrates with NDEx network database.
      Actively maintained (2025). Best for life science / academic paper RAG workflows.

  - id: skg-pipeline
    label: "SKG Pipeline (CS Paper KG)"
    kind: rag
    complexity: high
    local_capable: true
    runtime_support: [huggingface]
    multiagent: false
    mcp_support: false
    install: "# See repo README — rule-based + deep learning pipeline"
    best_for: [deep_research, research_pipeline]
    stars_approx: "~80"
    last_updated: "2022"
    note: >
      Rule + deep learning pipeline for scientific knowledge graph construction from CS papers.
      Not LLM-based. Last updated 2022 — consider as reference architecture, not active tooling.

  # ── Code Graph / IDE Skills ────────────────────────────

  - id: graphify
    label: "Graphify"
    kind: ide
    complexity: low
    local_capable: true
    runtime_support: [any]
    multiagent: false
    mcp_support: false
    install: "uv tool install graphifyy && graphify install"
    best_for: [code_review, local_copilot, deep_research, code_generation, document_rag]
    stars_approx: "~43,700"
    last_updated: "2026"
    note: >
      Project-to-knowledge-graph skill for AI coding assistants (Claude Code, Cursor, Codex, Gemini CLI, OpenClaw, etc.).
      Invoke with /graphify . — outputs graph.html (interactive viz), GRAPH_REPORT.md, and graph.json (queryable context).
      Input range: code (28 languages via tree-sitter, no API), docs/PDFs/images (via assistant API),
      video/audio/YouTube (graphifyy[video] extra), ArXiv papers (/graphify add <url>),
      Office files (.docx/.xlsx, graphifyy[office] extra).
      Code extraction is fully local (tree-sitter + Leiden); non-code types use the connected AI assistant's model.
      Actively maintained (2026, 43K+ stars in first month).

  # ── Vision Frameworks ─────────────────────────────────────

  - id: siglip2
    label: "SigLIP 2 (Zero-shot Image Classification)"
    kind: vision
    complexity: low
    local_capable: true
    runtime_support: [huggingface, any]
    multiagent: false
    mcp_support: false
    install: "pip install transformers torch"
    best_for: [image_classification]
    stars_approx: "N/A (Google DeepMind — HuggingFace weights)"
    last_updated: "2025"
    note: >
      Google DeepMind의 zero-shot 이미지 분류 모델.
      추가 학습 없이 임의 클래스 분류 가능 (ViT-B/16 기준 Top-1 78.2%, CLIP 68.3% 대비 +10%p).
      HuggingFace `pipeline("zero-shot-image-classification")` 으로 즉시 사용.

  - id: yolo
    label: "Ultralytics YOLO (v11 / v12)"
    kind: vision
    complexity: low
    local_capable: true
    runtime_support: [any]
    multiagent: false
    mcp_support: false
    install: "pip install ultralytics"
    best_for: [object_detection]
    stars_approx: "~40K+"
    last_updated: "2026"
    note: >
      실시간 객체 탐지의 사실상 표준. YOLO11n(2.6M params, COCO 39.5 mAP) ~ YOLO11x(54.7 mAP).
      YOLO12(2025, attention-centric): 55.2 mAP SOTA. TensorRT로 T4 650fps+ 가능.
      `pip install ultralytics` 한 줄로 추론·학습·내보내기 통합.

  - id: grounding-dino
    label: "Grounding DINO"
    kind: vision
    complexity: medium
    local_capable: true
    runtime_support: [huggingface, any]
    multiagent: false
    mcp_support: false
    install: "pip install transformers torch"
    best_for: [object_detection, visual_grounding]
    stars_approx: "~8K+"
    last_updated: "2025"
    note: >
      텍스트 쿼리로 학습에 없던 임의 객체를 탐지하는 open-vocabulary detection (ECCV 2024).
      Grounding DINO 1.5 Pro COCO 54.3 AP / 1.6 Pro 55.4 AP (zero-shot SOTA).
      "빨간 사과가 든 바구니"처럼 자연어 입력으로 bbox 출력.

  - id: florence-2
    label: "Florence-2 (Microsoft)"
    kind: vision
    complexity: low
    local_capable: true
    runtime_support: [huggingface, any]
    multiagent: false
    mcp_support: false
    install: "pip install transformers torch"
    best_for: [image_classification, object_detection, visual_grounding, visual_qa, document_ocr]
    stars_approx: "N/A (Microsoft — HuggingFace weights, MIT license)"
    last_updated: "2024"
    note: >
      단일 0.77B 모델로 분류·탐지·캡셔닝·Grounding·OCR 모두 처리 (MIT 라이선스).
      프롬프트 태그(<CAPTION>, <OD>, <CAPTION_TO_PHRASE_GROUNDING> 등)로 task 전환.
      30줄 미만 코드로 로컬 실행. transformers 외 추가 의존성 없음.

  - id: qwen2.5-vl
    label: "Qwen2.5-VL"
    kind: vision
    complexity: medium
    local_capable: true
    runtime_support: [ollama, huggingface, any]
    multiagent: false
    mcp_support: false
    install: "ollama pull qwen2.5-vl:7b"
    best_for: [visual_qa, document_ocr, visual_grounding, gui_agent, image_classification]
    stars_approx: "~20K+"
    last_updated: "2025"
    note: >
      DocVQA ANLS 0.964 (72B, 오픈소스 1위). Ollama 지원으로 로컬 즉시 실행.
      GUI 에이전트 내장 — 화면 좌표를 절대값 JSON으로 출력.
      한국어 OCR 지원. 3B~72B 사이즈로 GPU 요건 선택 가능.

  - id: smolvlm2
    label: "SmolVLM2 (HuggingFace)"
    kind: vision
    complexity: low
    local_capable: true
    runtime_support: [huggingface, any]
    multiagent: false
    mcp_support: false
    install: "pip install transformers torch"
    best_for: [visual_qa, image_classification]
    stars_approx: "N/A (HuggingFace model)"
    last_updated: "2025"
    note: >
      256M/500M/2.2B 초소형 VLM. 엣지/온디바이스 실행 전용.
      SigLIP-SO400M 비전 인코더 사용. CPU만으로 캡셔닝·VQA 실행 가능.
      배포 용량이 제약된 환경(Raspberry Pi, 모바일)의 기준 선택지.

  - id: internvl3
    label: "InternVL3"
    kind: vision
    complexity: medium
    local_capable: true
    runtime_support: [huggingface, any]
    multiagent: false
    mcp_support: false
    install: "pip install transformers torch"
    best_for: [visual_qa, document_ocr, image_classification]
    stars_approx: "~8K+"
    last_updated: "2025"
    note: >
      InternViT-6B + Qwen2.5-72B 조합. MMMU 72.2점 오픈소스 SOTA (CVPR 2024 Oral).
      Apache 2.0 라이선스. 1B~78B 사이즈. OpenGVLab(상하이AI연구원) 개발.

  - id: paddleocr
    label: "PaddleOCR / PaddleOCR-VL"
    kind: vision
    complexity: low
    local_capable: true
    runtime_support: [any]
    multiagent: false
    mcp_support: false
    install: "pip install paddlepaddle paddleocr"
    best_for: [document_ocr]
    stars_approx: "~45K+"
    last_updated: "2026"
    note: >
      Baidu의 오픈소스 OCR 파이프라인. 109개 언어 지원 (한국어 포함).
      PP-OCRv5: 탐지→방향분류→인식 3단계 파이프라인. CPU에서도 동작.
      PaddleOCR-VL: VLM 기반 문서 이해 확장판 (표·레이아웃 구조화 추출).
